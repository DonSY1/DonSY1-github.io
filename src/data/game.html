<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>猜数字小游戏</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#222;color:#fff;max-width:500px;margin:60px auto;padding:20px;text-align:center}
input{padding:10px;font-size:18px;width:180px;border-radius:6px;border:none}
button{padding:10px 22px;font-size:18px;background:#27ae60;color:white;border:none;border-radius:6px;margin:10px;cursor:pointer}
#tip{font-size:20px;margin:20px 0}
</style>
</head>
<body>
    <h1>🎮猜数字游戏</h1>
    <p>我想好了1~100之间的数字，请你来猜！</p>

    <input id="numInput" type="number" placeholder="输入数字">
    <br>
    <button onclick="guess()">猜！</button>
    <button onclick="resetGame()">重新开始</button>

    <div id="tip"></div>
    <p>猜测次数：<span id="count">0</span></p>

<script>
//生成1‑100随机答案
let answer = Math.floor(Math.random()*100)+1;
let count = 0;
let gameOver = false; //游戏结束标记

const tipDom = document.getElementById('tip');
const countDom = document.getElementById('count');
const inputDom = document.getElementById('numInput');

function guess(){
    //游戏结束，直接返回，不让继续猜
    if(gameOver){
        tipDom.innerText="✅游戏已经结束，请点重新开始！";
        return;
    }

    let val = parseInt(inputDom.value);
    //判断输入合法性
    if(isNaN(val) || val<1 || val>100){
        tipDom.innerText="⚠️请输入1‑100的数字！";
        return;
    }
    count++;
    countDom.innerText = count;

    if(val>answer){
        tipDom.innerText="📉猜大了，再小一点";
    }else if(val<answer){
        tipDom.innerText="📈猜小了，再大一点";
    }else{
        tipDom.innerText="🎉恭喜猜对！答案就是"+answer;
        gameOver = true; //猜对，游戏结束
    }
    inputDom.value="";
}

//重置游戏
function resetGame(){
    answer = Math.floor(Math.random()*100)+1;
    count = 0;
    gameOver = false;
    countDom.innerText=0;
    tipDom.innerText="";
    inputDom.value="";
}
</script>
</body>
</html>
