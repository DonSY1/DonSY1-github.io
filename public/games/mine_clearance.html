<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>扫雷</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{padding:30px;background:#1a1a1a;color:#fff;text-align:center}
        #mine{display:inline-grid;gap:2px;background:#999;padding:2px;margin:10px auto}
        .mine-cell{width:24px;height:24px;display:grid;place-items:center;background:#bbb;font-weight:bold;cursor:pointer;user-select:none}
        .mine-cell.open{background:#ddd}
        .mine-cell.bomb{background:#f44}
    </style>
</head>
<body>
    <h3>扫雷｜左键点开，右键插旗</h3>
    <div id="mine"></div>
    <p>剩余地雷：<span id="mineCount">10</span></p>
<script>
let mineData, mineOpen, mineFlag, mineLeft
const mineW=10, mineH=10, mineNum=10
const mineBoard = document.getElementById('mine')
const mineCountEl = document.getElementById('mineCount')

function initMine(){
    mineBoard.innerHTML=''
    mineBoard.style.gridTemplateColumns=`repeat(${mineW},24px)`
    mineData = Array.from({length:mineH},()=>Array(mineW).fill(0))
    mineOpen = Array.from({length:mineH},()=>Array(mineW).fill(false))
    mineFlag = Array.from({length:mineH},()=>Array(mineW).fill(false))
    mineLeft = mineNum
    mineCountEl.textContent=mineLeft

    let c=0
    while(c<mineNum){
        const x=Math.floor(Math.random()*mineW)
        const y=Math.floor(Math.random()*mineH)
        if(mineData[y][x]!==-1){
            mineData[y][x]=-1
            c++
        }
    }
    for(let y=0;y<mineH;y++){
        for(let x=0;x<mineW;x++){
            if(mineData[y][x]===-1) continue
            let cnt=0
            for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
                const ny=y+dy,nx=x+dx
                if(ny>=0&&nx>=0&&ny<mineH&&nx<mineW&&mineData[ny][nx]===-1) cnt++
            }
            mineData[y][x]=cnt
        }
    }
    for(let y=0;y<mineH;y++){
        for(let x=0;x<mineW;x++){
            const div = document.createElement('div')
            div.className='mine-cell'
            div.dataset.x=x,div.dataset.y=y
            div.onclick=()=>mineClick(x,y)
            div.oncontextmenu=(e)=>{
                e.preventDefault()
                mineRight(x,y)
            }
            mineBoard.appendChild(div)
        }
    }
    renderMine()
}
function mineClick(x,y){
    if(mineOpen[y][x]||mineFlag[y][x]) return
    if(mineData[y][x]===-1){
        mineOpen[y][x]=true
        renderMine()
        alert('踩到地雷！游戏结束')
        return
    }
    openCell(x,y)
    renderMine()
    checkMineWin()
}
function mineRight(x,y){
    if(mineOpen[y][x]) return
    mineFlag[y][x] = !mineFlag[y][x]
    mineLeft += mineFlag[y][x] ? -1 : 1
    mineCountEl.textContent = mineLeft
    renderMine()
}
function openCell(x,y){
    if(x<0||y<0||x>=mineW||y>=mineH||mineOpen[y][x]||mineFlag[y][x]) return
    mineOpen[y][x]=true
    if(mineData[y][x]===0){
        openCell(x-1,y);openCell(x+1,y);openCell(x,y-1);openCell(x,y+1)
        openCell(x-1,y-1);openCell(x+1,y-1);openCell(x-1,y+1);openCell(x+1,y+1)
    }
}
function renderMine(){
    const cells = document.querySelectorAll('.mine-cell')
    cells.forEach(cell=>{
        const x = +cell.dataset.x
        const y = +cell.dataset.y
        cell.classList.remove('open','bomb')
        if(mineOpen[y][x]){
            cell.classList.add('open')
            if(mineData[y][x]===-1){
                cell.classList.add('bomb')
                cell.textContent='💣'
            }else if(mineData[y][x]>0){
                cell.textContent = mineData[y][x]
            }else{
                cell.textContent=''
            }
        }else{
            if(mineFlag[y][x]){
                cell.textContent='🚩'
            }else{
                cell.textContent=''
            }
        }
    })
}
function checkMineWin(){
    let unOpen = 0
    for(let y=0;y<mineH;y++){
        for(let x=0;x<mineW;x++){
            if(!mineOpen[y][x]) unOpen++
        }
    }
    if(unOpen === mineNum){
        alert('恭喜扫雷成功！')
    }
}
initMine()
</script>
</body>
</html>
